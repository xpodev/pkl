name: Publish to PyPI

# Publishing is triggered by publishing a GitHub release (which also creates the
# tag). Pushing a tag does not publish on its own: that used to fire this
# workflow a second time for the same version, and the second upload fails.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ.get("TAG", "")
          if not tag:
              print(f"no release tag (manual run); package version is {version}")
              sys.exit(0)
          if re.sub(r"^v", "", tag) != version:
              sys.exit(f"release tag {tag!r} does not match pyproject.toml version {version!r}")
          print(f"tag {tag} matches version {version}")
          PY

  test:
    name: Tests
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build package
      run: uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  test-pypi:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        # Re-running a failed publish must not trip over the Test PyPI upload that already happened.
        skip-existing: true

  pypi:
    runs-on: ubuntu-latest
    needs: [build, test-pypi]
    environment: release

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
