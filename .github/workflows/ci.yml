name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  # Lets publish.yml run the exact same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is the minimum supported version.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Type check
        run: uv run mypy --strict pkl tests examples/sdk.py examples/main.py examples/zones.py

      - name: Test
        run: uv run pytest

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Build documentation
        run: uv run mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "
          import pkl, pkl.tracking, pkl.events, pkl.syscall, pkl.timing, pkl.files, pkl.modules
          from importlib.metadata import version
          assert version('plugins-kernel') == pkl.__version__, (version('plugins-kernel'), pkl.__version__)
          print('ok', pkl.__version__)
          "
