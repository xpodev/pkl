site_name: pkl
site_description: Attribute resources to plugins and release them on demand
site_author: xpodev
site_url: https://xpodev.github.io/pkl

repo_name: xpodev/pkl
repo_url: https://github.com/xpodev/pkl
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - autorefs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Core Concepts: getting-started/concepts.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - Lifetimes: guide/lifetimes.md
    - Tracking: guide/tracking.md
    - Events: guide/events.md
    - Context, Async & Threads: guide/context.md
    - Timers, Files & Modules: guide/resources.md
    - Dependencies: guide/dependencies.md
    - Hosts as Resources: guide/hosting.md
    - Building an SDK: guide/sdk.md
  - API Reference: api/index.md
  - Examples: examples/overview.md
